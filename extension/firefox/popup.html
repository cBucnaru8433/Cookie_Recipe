<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Cookie Transfer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <h1>Cookie Transfer</h1>
        <div style="display: flex; gap: 4px;">
            <button id="openTabBtn" class="theme-btn" title="Open in new tab">
            <img id="openTabIcon" src="icons/tabs_dark.png" alt="Open Tab">
        </button>
            <button id="themeToggle" class="theme-btn" title="Toggle Theme">
            <img id="themeIcon" src="icons/dark.png" alt="Theme">
        </button>
        </div>
    </div>

    <div class="site" id="currentSite">Loading current site…</div>

    <button id="exportSite">Export cookies for this site</button>
    <button id="exportAll">Export ALL cookies (every site)</button>

    <hr>

    <div>Import a previously exported file:</div>


    <div class="file-container" id="dropZone">
        <span id="fileName">Drag & drop JSON file here or click</span>
        <button type="button" id="selectFileBtn">Choose File</button>
        <input type="file" id="importFile" accept=".json" style="display: none;">
    </div>

    <button id="importBtn" class="primary">Import cookies</button>

    <hr>

    <button id="refreshBtn">Refresh site</button>

    <div id="status"></div>

    <div class="warn">
        Cookies can grant access to your logged-in accounts. Only transfer them between your own browsers/devices, and delete the exported file when you're done.
    </div>

    <script src="popup.js"></script>
</body>

</html>
